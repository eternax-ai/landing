<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting…</title>
    <link rel="canonical" href="{{ include.to }}">
    <meta http-equiv="refresh" content="0; url={{ include.to }}">
    <meta name="robots" content="noindex, follow">
    <script>location.replace({{ include.to | jsonify }} + window.location.search + window.location.hash);</script>
</head>
<body>
    <p>This page has moved to <a href="{{ include.to }}">{{ include.to }}</a>.</p>
</body>
</html>
