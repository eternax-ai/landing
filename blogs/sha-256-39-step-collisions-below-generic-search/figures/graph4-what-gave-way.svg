<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Graph 4: what gave way, 1999–2026" font-family='"IBM Plex Sans", "Helvetica Neue", Helvetica, Arial, sans-serif'>
