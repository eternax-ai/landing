<text x="508.3" y="121.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">(e.g. Compact-LWE) 2017–19</text>
<circle cx="625.0" cy="84.0" r="5" fill="#77756f" stroke="#ffffff" stroke-width="2"/>
<text x="625.0" y="56.0" font-size="11" fill="#52514e" text-anchor="middle" font-weight="normal">EagleSign</text>
