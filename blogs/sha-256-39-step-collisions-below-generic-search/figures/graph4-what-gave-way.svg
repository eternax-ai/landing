<text x="345.0" y="189.0" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="normal">2011</text>
<line x1="438.3" y1="194.0" x2="438.3" y2="207.0" stroke="#2a78d6" stroke-width="1.2" stroke-linecap="butt"/>
<text x="448.3" y="176.0" font-size="11" fill="#2a78d6" text-anchor="end" font-weight="600">SPHINCS</text>
<text x="448.3" y="189.0" font-size="11" fill="#2a78d6" text-anchor="end" font-weight="normal">2015</text>
<line x1="485.0" y1="194.0" x2="485.0" y2="207.0" stroke="#2a78d6" stroke-width="1.2" stroke-linecap="butt"/>
<text x="475.0" y="176.0" font-size="11" fill="#2a78d6" text-anchor="start" font-weight="600">SPHINCS+</text>
<text x="475.0" y="189.0" font-size="11" fill="#2a78d6" text-anchor="start" font-weight="normal">2017</text>
<line x1="648.3" y1="194.0" x2="648.3" y2="207.0" stroke="#2a78d6" stroke-width="1.2" stroke-linecap="butt"/>
<text x="648.3" y="176.0" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="600">SLH-DSA</text>
<text x="648.3" y="189.0" font-size="11" fill="#2a78d6" text-anchor="middle" font-weight="normal">FIPS 205, 2024</text>
<text x="345.0" y="236.0" font-size="12" fill="#2a78d6" text-anchor="start" font-weight="700">None broken</text>
<circle cx="601.7" cy="212" r="6" fill="#ffffff" stroke="#eb6834" stroke-width="2.5"/>
<text x="601.7" y="236.0" font-size="10.5" fill="#b4521f" text-anchor="middle" font-weight="normal">2022 · category-5 SHA-256</text>
<text x="601.7" y="249.0" font-size="10.5" fill="#b4521f" text-anchor="middle" font-weight="normal">parameter weakness, fixed</text>
<text x="30.0" y="284.0" font-size="13" fill="#1a1a19" text-anchor="start" font-weight="600">SHA-256</text>
<rect x="135.0" y="299" width="578.7" height="10" rx="5" fill="#2a78d6"/>
<text x="135.0" y="328.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">Standardized 2002 (FIPS 180-2)</text>
<text x="713.7" y="328.0" font-size="11" fill="#52514e" text-anchor="end" font-weight="normal">No attack on full SHA-256 better than generic</text>
<line x1="30.0" y1="350.0" x2="730.0" y2="350.0" stroke="#b9b8b2" stroke-width="1" stroke-linecap="butt"/>
<line x1="88.3" y1="350.0" x2="88.3" y2="354.0" stroke="#b9b8b2" stroke-width="1" stroke-linecap="butt"/>
<text x="88.3" y="368.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal">2000</text>
<line x1="205.0" y1="350.0" x2="205.0" y2="354.0" stroke="#b9b8b2" stroke-width="1" stroke-linecap="butt"/>
<text x="205.0" y="368.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal">2005</text>
<line x1="321.7" y1="350.0" x2="321.7" y2="354.0" stroke="#b9b8b2" stroke-width="1" stroke-linecap="butt"/>
<text x="321.7" y="368.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal">2010</text>
<line x1="438.3" y1="350.0" x2="438.3" y2="354.0" stroke="#b9b8b2" stroke-width="1" stroke-linecap="butt"/>
<text x="438.3" y="368.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal">2015</text>
<line x1="555.0" y1="350.0" x2="555.0" y2="354.0" stroke="#b9b8b2" stroke-width="1" stroke-linecap="butt"/>
<text x="555.0" y="368.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal">2020</text>
<line x1="671.7" y1="350.0" x2="671.7" y2="354.0" stroke="#b9b8b2" stroke-width="1" stroke-linecap="butt"/>
<text x="671.7" y="368.0" font-size="11" fill="#8a8984" text-anchor="middle" font-weight="normal">2025</text>
<text x="30.0" y="392.0" font-size="10.5" fill="#8a8984" text-anchor="start" font-weight="normal">Scheme failures shown. The core lattice problems (LWE, SIS) and ML-DSA remain unbroken.</text>
<text x="30.0" y="406.0" font-size="10.5" fill="#8a8984" text-anchor="start" font-weight="normal">Implementation attacks (side channels, faults) affect both families and are not shown.</text>
<text x="30.0" y="420.0" font-size="10.5" fill="#8a8984" text-anchor="start" font-weight="normal">Earlier hash functions MD5 and SHA-1 were broken in 2004–2017; SHA-2 uses a substantially stronger design.</text>
</svg>
